name: Bug report
description: Something in the panel, an API or the connector kit does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open SEO & GEO Merkezi\n2. …"
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or API responses
      description: Remove tokens, client names and personal data first.
      render: text
