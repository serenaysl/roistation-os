name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Which part of the system does it touch (publishing, connector, Vercel, SEO & GEO, auth)?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
