name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (demo catalog)
        run: npm run build
      - name: Type-check
        # after the build: next-env.d.ts references route types generated in .next/
        run: npm run typecheck
      - name: Smoke test
        run: npm run smoke
      - name: Integration test
        run: npm run test:integration
