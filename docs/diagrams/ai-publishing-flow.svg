<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
<title id="t">AI-assisted content flow</title><desc id="d">Generation is idempotent and never publishes by itself: every draft is reviewed by a person first.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#79a89b"/></marker>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#131c1a" stroke-width="1"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#79f2bf" stop-opacity=".10"/><stop offset=".55" stop-color="#79f2bf" stop-opacity="0"/></linearGradient>
<style>
text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.h1 { font-size: 22px; font-weight: 700; fill: #f4f7f5; letter-spacing: -.02em; }
.h2 { font-size: 13px; fill: #8e9d99; }
.kick { font-size: 11px; font-weight: 700; fill: #79f2bf; letter-spacing: .14em; }
.glabel { font-size: 10.5px; font-weight: 700; fill: #6f837e; letter-spacing: .12em; }
.bt { font-size: 14px; font-weight: 650; text-anchor: middle; }
.bs { font-size: 11.5px; fill: #93a5a0; text-anchor: middle; }
.bm { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 10.5px; fill: #79c9a8; text-anchor: middle; }
.al { font-size: 10.5px; fill: #b7c7c2; text-anchor: middle; }
.note { font-size: 11.5px; fill: #7d8f8a; }
.tree { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13px; fill: #d9e4e1; }
.treec { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #7d8f8a; }
</style>
</defs>
<rect width="1280" height="560" rx="18" fill="#0a0f0e"/>
<rect width="1280" height="560" rx="18" fill="url(#grid)"/>
<rect width="1280" height="560" rx="18" fill="url(#glow)"/>
<text x="36" y="44" class="kick">ROISTATION MASTER PANEL</text>
<text x="36" y="72" class="h1">AI-assisted content flow</text>
<text x="36" y="94" class="h2">Generation is idempotent and never publishes by itself: every draft is reviewed by a person first.</text>
<rect x="40" y="150" width="200" height="80" rx="11" fill="#0f1824" stroke="#3b6fb0"/>
<text x="140.0" y="178.0" class="bt" fill="#e8f1ff">Source</text>
<text x="140.0" y="196.0" class="bs">text · file · folder</text>
<text x="140.0" y="212.0" class="bs">/api/extract (DOCX)</text>
<rect x="280" y="150" width="200" height="80" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="380.0" y="178.0" class="bt" fill="#eef4f2">Brief</text>
<text x="380.0" y="196.0" class="bs">goal · type · sites</text>
<text x="380.0" y="212.0" class="bs">strategy · placement</text>
<rect x="520" y="150" width="240" height="80" rx="11" fill="#0f201a" stroke="#3fbf8c"/>
<text x="640.0" y="186.0" class="bt" fill="#eafff5">POST /api/automation</text>
<text x="640.0" y="204.0" class="bs">generationId (idempotency key)</text>
<rect x="800" y="150" width="200" height="80" rx="11" fill="#1f1a0e" stroke="#b98a2c"/>
<text x="900.0" y="178.0" class="bt" fill="#fff6e3">Fingerprint</text>
<text x="900.0" y="196.0" class="bs">same request →</text>
<text x="900.0" y="212.0" class="bs">reuse stored result</text>
<rect x="1040" y="150" width="200" height="80" rx="11" fill="#18142a" stroke="#7c68c9"/>
<text x="1140.0" y="178.0" class="bt" fill="#f1edff">Provider</text>
<text x="1140.0" y="196.0" class="bs">Anthropic → OpenAI</text>
<text x="1140.0" y="212.0" class="bs">none → demo (blocked)</text>
<path d="M 240 190 L 280 190" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 480 190 L 520 190" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 760 190 L 800 190" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 1000 190 L 1040 190" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="160" y="330" width="260" height="80" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="290.0" y="358.0" class="bt" fill="#eef4f2">Generation record</text>
<text x="290.0" y="376.0" class="bs">pending → complete / failed</text>
<text x="290.0" y="392.0" class="bs">generations/&lt;id&gt;.json</text>
<rect x="460" y="330" width="260" height="80" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="590.0" y="358.0" class="bt" fill="#eef4f2">Per-site drafts</text>
<text x="590.0" y="376.0" class="bs">title · summary · body</text>
<text x="590.0" y="392.0" class="bs">meta title / description</text>
<rect x="760" y="330" width="220" height="80" rx="11" fill="#0f201a" stroke="#3fbf8c"/>
<text x="870.0" y="366.0" class="bt" fill="#eafff5">Human review</text>
<text x="870.0" y="384.0" class="bs">edit · approve</text>
<rect x="1020" y="330" width="220" height="80" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="1130.0" y="366.0" class="bt" fill="#eef4f2">POST /api/publish</text>
<text x="1130.0" y="384.0" class="bs">demo output rejected</text>
<path d="M 1140 230 L 1140 280 L 290 280 L 290 330" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 420 370 L 460 370" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 720 370 L 760 370" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 980 370 L 1020 370" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="460" y="450" width="780" height="60" rx="11" fill="#0f201a" stroke="#3fbf8c"/>
<text x="850.0" y="484.0" class="bt" fill="#eafff5">Publication with per-site targets → publishing flow (placement, schema, scheduling, revalidation)</text>
<path d="M 1130 410 L 1130 450" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
