<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="t d">
<title id="t">Site connector flow</title><desc id="d">Client sites render central content with their own layout; the panel exposes read-only, published-only APIs.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#79a89b"/></marker>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#131c1a" stroke-width="1"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#79f2bf" stop-opacity=".10"/><stop offset=".55" stop-color="#79f2bf" stop-opacity="0"/></linearGradient>
<style>
text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.h1 { font-size: 22px; font-weight: 700; fill: #f4f7f5; letter-spacing: -.02em; }
.h2 { font-size: 13px; fill: #8e9d99; }
.kick { font-size: 11px; font-weight: 700; fill: #79f2bf; letter-spacing: .14em; }
.glabel { font-size: 10.5px; font-weight: 700; fill: #6f837e; letter-spacing: .12em; }
.bt { font-size: 14px; font-weight: 650; text-anchor: middle; }
.bs { font-size: 11.5px; fill: #93a5a0; text-anchor: middle; }
.bm { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 10.5px; fill: #79c9a8; text-anchor: middle; }
.al { font-size: 10.5px; fill: #b7c7c2; text-anchor: middle; }
.note { font-size: 11.5px; fill: #7d8f8a; }
.tree { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13px; fill: #d9e4e1; }
.treec { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #7d8f8a; }
</style>
</defs>
<rect width="1280" height="620" rx="18" fill="#0a0f0e"/>
<rect width="1280" height="620" rx="18" fill="url(#grid)"/>
<rect width="1280" height="620" rx="18" fill="url(#glow)"/>
<text x="36" y="44" class="kick">ROISTATION MASTER PANEL</text>
<text x="36" y="72" class="h1">Site connector flow</text>
<text x="36" y="94" class="h2">Client sites render central content with their own layout; the panel exposes read-only, published-only APIs.</text>
<rect x="40" y="120" width="520" height="470" rx="16" fill="#0e1413" stroke="#1f2a28" stroke-dasharray="4 5"/>
<text x="56" y="144" class="glabel">CLIENT SITE</text>
<rect x="720" y="120" width="520" height="470" rx="16" fill="#0e1413" stroke="#1f2a28" stroke-dasharray="4 5"/>
<text x="736" y="144" class="glabel">MASTER PANEL</text>
<rect x="60" y="160" width="480" height="64" rx="11" fill="#0f201a" stroke="#3fbf8c"/>
<text x="300.0" y="188.0" class="bt" fill="#eafff5">/rehber/[slug] · /blog/[slug] · &lt;RoistationSection /&gt;</text>
<text x="300.0" y="206.0" class="bs">connector kit, rendered inside the site&#x27;s own layout</text>
<rect x="740" y="160" width="480" height="64" rx="11" fill="#0f201a" stroke="#3fbf8c"/>
<text x="980.0" y="188.0" class="bt" fill="#eafff5">/api/site-page · /api/site-pages</text>
<text x="980.0" y="206.0" class="bs">published page model · archive listings</text>
<path d="M 540 192 L 740 192" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="605.55" y="173.0" width="68.9" height="18" rx="9" fill="#0a0f0e" stroke="#1f2a28"/>
<text x="640.0" y="186.0" class="al">SSR fetch</text>
<rect x="60" y="244" width="480" height="64" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="300.0" y="272.0" class="bt" fill="#eef4f2">app/sitemap.ts</text>
<text x="300.0" y="290.0" class="bs">...(await roistationSitemapEntries())</text>
<rect x="740" y="244" width="480" height="64" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="980.0" y="272.0" class="bt" fill="#eef4f2">/api/site-sitemap?siteId=</text>
<text x="980.0" y="290.0" class="bs">published page URLs</text>
<path d="M 540 276 L 740 276" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="587.25" y="257.0" width="105.5" height="18" rx="9" fill="#0a0f0e" stroke="#1f2a28"/>
<text x="640.0" y="270.0" class="al">sitemap entries</text>
<rect x="60" y="328" width="480" height="64" rx="11" fill="#0f1824" stroke="#3b6fb0"/>
<text x="300.0" y="356.0" class="bt" fill="#e8f1ff">widget.js → iframe /embed/[siteId]</text>
<text x="300.0" y="374.0" class="bs">HTML sites · homepage, service page, footer slots</text>
<rect x="740" y="328" width="480" height="64" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="980.0" y="356.0" class="bt" fill="#eef4f2">/api/site-content · /api/form-token · /api/submissions</text>
<text x="980.0" y="374.0" class="bs">slot content · signed form tokens · leads</text>
<path d="M 540 360 L 740 360" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="593.35" y="341.0" width="93.3" height="18" rx="9" fill="#0a0f0e" stroke="#1f2a28"/>
<text x="640.0" y="354.0" class="al">poll · submit</text>
<rect x="60" y="412" width="480" height="64" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="300.0" y="440.0" class="bt" fill="#eef4f2">/api/roistation/verify</text>
<text x="300.0" y="458.0" class="bs">connector version and site id</text>
<rect x="740" y="412" width="480" height="64" rx="11" fill="#18142a" stroke="#7c68c9"/>
<text x="980.0" y="440.0" class="bt" fill="#f1edff">verifySite()</text>
<text x="980.0" y="458.0" class="bs">Vercel first → verify endpoint → widget marker</text>
<path d="M 740 444 L 540 444" fill="none" stroke="#5f7c75" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="596.4" y="425.0" width="87.19999999999999" height="18" rx="9" fill="#0a0f0e" stroke="#1f2a28"/>
<text x="640.0" y="438.0" class="al">verification</text>
<rect x="60" y="496" width="480" height="64" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="300.0" y="524.0" class="bt" fill="#eef4f2">/api/roistation/revalidate</text>
<text x="300.0" y="542.0" class="bs">revalidatePath · x-roistation-secret</text>
<rect x="740" y="496" width="480" height="64" rx="11" fill="#18142a" stroke="#7c68c9"/>
<text x="980.0" y="524.0" class="bt" fill="#f1edff">revalidateSites()</text>
<text x="980.0" y="542.0" class="bs">after withdraw / delete · verified origins only</text>
<path d="M 740 528 L 540 528" fill="none" stroke="#5f7c75" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="599.45" y="509.0" width="81.1" height="18" rx="9" fill="#0a0f0e" stroke="#1f2a28"/>
<text x="640.0" y="522.0" class="al">cache purge</text>
<text x="40" y="608" class="note" text-anchor="start">Solid: the client site calls the panel.  Dashed: the panel calls the client site.</text>
</svg>
