<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="t d">
<title id="t">Repository layout</title><desc id="d">Domain logic lives in lib/, route handlers stay thin, and everything shipped to client sites sits under connectors/.</desc>
<defs>
