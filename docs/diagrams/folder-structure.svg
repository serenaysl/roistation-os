<path d="M 72 160 V 173 H 86" fill="none" stroke="#2c3b37"/>
<text x="92" y="178" class="tree" fill="#d9e4e1" style="fill:#d9e4e1">api/</text>
<text x="470" y="178" class="treec">session · sites · connections · publications · publish · automation</text>
<line x1="60" x2="1040" y1="192" y2="192" stroke="#141d1b"/>
<path d="M 72 198 V 211 H 86" fill="none" stroke="#2c3b37"/>
<text x="92" y="216" class="tree" fill="#d9e4e1" style="fill:#d9e4e1">api/seo/</text>
<text x="470" y="216" class="treec">scan · report · optimize · ignore</text>
