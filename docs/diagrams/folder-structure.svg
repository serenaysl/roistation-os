<text x="60" y="672" class="tree" fill="#79f2bf" style="fill:#79f2bf">docs/ · code-showcase/ · examples/</text>
<text x="470" y="672" class="treec">architecture docs, annotated walkthroughs, runnable extracts</text>
<line x1="60" x2="1040" y1="686" y2="686" stroke="#141d1b"/>
