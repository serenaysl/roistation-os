<text x="36" y="44" class="kick">ROISTATION MASTER PANEL</text>
<text x="36" y="72" class="h1">Repository layout</text>
<text x="36" y="94" class="h2">Domain logic lives in lib/, route handlers stay thin, and everything shipped to client sites sits under connectors/.</text>
