<text x="92" y="482" class="tree" fill="#d9e4e1" style="fill:#d9e4e1">seo/</text>
<text x="470" y="482" class="treec">scanner · checks · html · presentation · fixes · optimize</text>
<line x1="60" x2="1040" y1="496" y2="496" stroke="#141d1b"/>
<path d="M 72 502 V 515 H 86" fill="none" stroke="#2c3b37"/>
<text x="92" y="520" class="tree" fill="#d9e4e1" style="fill:#d9e4e1">vercel/ · github/</text>
<text x="470" y="520" class="treec">REST clients, sealed credentials, sync</text>
<line x1="60" x2="1040" y1="534" y2="534" stroke="#141d1b"/>
<text x="60" y="558" class="tree" fill="#79f2bf" style="fill:#79f2bf">connectors/</text>
<text x="470" y="558" class="treec">kit copied into client sites + route templates</text>
