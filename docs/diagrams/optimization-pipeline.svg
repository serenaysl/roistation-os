<text x="1080.0" y="177.0" class="bt" fill="#eef4f2">Read repository tree</text>
<text x="1080.0" y="195.0" class="bs">skip files that already exist</text>
<text x="1080.0" y="213.0" class="bm">lib/github/api.ts</text>
