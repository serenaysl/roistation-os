<rect x="40" y="380" width="220" height="76" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="150.0" y="414.0" class="bt" fill="#eef4f2">Blobs → tree → commit</text>
<text x="150.0" y="432.0" class="bs">Git Data API</text>
<rect x="300" y="380" width="220" height="76" rx="11" fill="#18142a" stroke="#7c68c9"/>
<text x="410.0" y="414.0" class="bt" fill="#f1edff">New branch + PR</text>
<text x="410.0" y="432.0" class="bs">one PR per site</text>
<rect x="560" y="380" width="220" height="76" rx="11" fill="#0f1824" stroke="#3b6fb0"/>
<text x="670.0" y="414.0" class="bt" fill="#e8f1ff">ROISTATION_* env</text>
<text x="670.0" y="432.0" class="bs">set via Vercel API</text>
<rect x="820" y="380" width="200" height="76" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="920.0" y="414.0" class="bt" fill="#eef4f2">Preview deploy</text>
<text x="920.0" y="432.0" class="bs">reviewed by a person</text>
<rect x="1060" y="380" width="180" height="76" rx="11" fill="#0f201a" stroke="#3fbf8c"/>
<text x="1150.0" y="414.0" class="bt" fill="#eafff5">Merge</text>
<text x="1150.0" y="432.0" class="bs">production deploy</text>
<path d="M 1080 226 L 1080 352 L 150 352 L 150 380" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 260 418 L 300 418" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
