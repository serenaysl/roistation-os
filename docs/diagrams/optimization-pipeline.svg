<text x="390.0" y="177.0" class="bt" fill="#eafff5">planFixes()</text>
<text x="390.0" y="195.0" class="bs">latest scan + business profile</text>
<text x="390.0" y="213.0" class="bm">lib/seo/fixes.ts</text>
<path d="M 240 188 L 280 188" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560" y="130" width="300" height="60" rx="11" fill="#0f201a" stroke="#3fbf8c"/>
<text x="710.0" y="156.0" class="bt" fill="#eafff5">auto</text>
<text x="710.0" y="174.0" class="bs">robots · sitemap · llms.txt · metadata · JSON-LD</text>
<path d="M 500 188 L 530 188 L 530 160 L 560 160" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560" y="202" width="300" height="60" rx="11" fill="#18142a" stroke="#7c68c9"/>
<text x="710.0" y="228.0" class="bt" fill="#f1edff">ai</text>
<text x="710.0" y="246.0" class="bs">FAQ · local content → AI screen, human approval</text>
<path d="M 500 188 L 530 188 L 530 232 L 560 232" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560" y="274" width="300" height="60" rx="11" fill="#0e1413" stroke="#1f2a28"/>
<text x="710.0" y="300.0" class="bt" fill="#c7d2cf">guided</text>
<text x="710.0" y="318.0" class="bs">steps listed in the PR description</text>
