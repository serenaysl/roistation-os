<path d="M 1020 418 L 1060 418" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560" y="510" width="680" height="60" rx="11" fill="#0f201a" stroke="#3fbf8c"/>
<text x="900.0" y="544.0" class="bt" fill="#eafff5">Automatic re-scan after the new deployment → score history shows the delta</text>
<path d="M 1150 456 L 1150 510" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
