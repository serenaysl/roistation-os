<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
<title id="t">Publishing flow</title><desc id="d">Every target site is evaluated independently; one failing site never blocks the others.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#79a89b"/></marker>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#131c1a" stroke-width="1"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#79f2bf" stop-opacity=".10"/><stop offset=".55" stop-color="#79f2bf" stop-opacity="0"/></linearGradient>
<style>
text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.h1 { font-size: 22px; font-weight: 700; fill: #f4f7f5; letter-spacing: -.02em; }
.h2 { font-size: 13px; fill: #8e9d99; }
.kick { font-size: 11px; font-weight: 700; fill: #79f2bf; letter-spacing: .14em; }
.glabel { font-size: 10.5px; font-weight: 700; fill: #6f837e; letter-spacing: .12em; }
.bt { font-size: 14px; font-weight: 650; text-anchor: middle; }
.bs { font-size: 11.5px; fill: #93a5a0; text-anchor: middle; }
.bm { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 10.5px; fill: #79c9a8; text-anchor: middle; }
.al { font-size: 10.5px; fill: #b7c7c2; text-anchor: middle; }
.note { font-size: 11.5px; fill: #7d8f8a; }
.tree { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13px; fill: #d9e4e1; }
.treec { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #7d8f8a; }
</style>
</defs>
<rect width="1280" height="640" rx="18" fill="#0a0f0e"/>
<rect width="1280" height="640" rx="18" fill="url(#grid)"/>
<rect width="1280" height="640" rx="18" fill="url(#glow)"/>
<text x="36" y="44" class="kick">ROISTATION MASTER PANEL</text>
<text x="36" y="72" class="h1">Publishing flow</text>
<text x="36" y="94" class="h2">Every target site is evaluated independently; one failing site never blocks the others.</text>
<rect x="40" y="140" width="190" height="78" rx="11" fill="#0f1824" stroke="#3b6fb0"/>
<text x="135.0" y="175.0" class="bt" fill="#e8f1ff">Draft</text>
<text x="135.0" y="193.0" class="bs">manual or AI-assisted</text>
<rect x="270" y="140" width="210" height="78" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="375.0" y="168.0" class="bt" fill="#eef4f2">Placement</text>
<text x="375.0" y="186.0" class="bs">location · strategy · scope</text>
<text x="375.0" y="204.0" class="bm">definitions.ts</text>
<rect x="520" y="140" width="200" height="78" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="620.0" y="175.0" class="bt" fill="#eef4f2">Summary &amp; confirm</text>
<text x="620.0" y="193.0" class="bs">targets · schedule · URL</text>
<rect x="760" y="140" width="220" height="78" rx="11" fill="#0f201a" stroke="#3fbf8c"/>
<text x="870.0" y="168.0" class="bt" fill="#eafff5">operatePublication</text>
<text x="870.0" y="186.0" class="bs">PATCH /api/publications</text>
<text x="870.0" y="204.0" class="bm">version check</text>
<rect x="1020" y="140" width="220" height="78" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="1130.0" y="168.0" class="bt" fill="#eef4f2">Channel evaluate</text>
<text x="1130.0" y="186.0" class="bs">site-feed channel</text>
<text x="1130.0" y="204.0" class="bm">verified connection?</text>
<path d="M 230 179 L 270 179" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 480 179 L 520 179" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 720 179 L 760 179" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 980 179 L 1020 179" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60" y="290" width="250" height="64" rx="11" fill="#0f201a" stroke="#3fbf8c"/>
<text x="185.0" y="318.0" class="bt" fill="#eafff5">published</text>
<text x="185.0" y="336.0" class="bs">live on the site feed</text>
<path d="M 1130 218 L 1130 250 L 185 250 L 185 290" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360" y="290" width="250" height="64" rx="11" fill="#0f1824" stroke="#3b6fb0"/>
<text x="485.0" y="318.0" class="bt" fill="#e8f1ff">scheduled</text>
<text x="485.0" y="336.0" class="bs">visible when scheduledAt ≤ now</text>
<path d="M 1130 218 L 1130 250 L 485 250 L 485 290" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="660" y="290" width="250" height="64" rx="11" fill="#1f1a0e" stroke="#b98a2c"/>
<text x="785.0" y="318.0" class="bt" fill="#fff6e3">skipped</text>
<text x="785.0" y="336.0" class="bs">unverified, scope = all-connected</text>
<path d="M 1130 218 L 1130 250 L 785 250 L 785 290" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="960" y="290" width="250" height="64" rx="11" fill="#231213" stroke="#b8504c"/>
<text x="1085.0" y="318.0" class="bt" fill="#ffecea">failed</text>
<text x="1085.0" y="336.0" class="bs">reason stored per target</text>
<path d="M 1130 218 L 1130 250 L 1085 250 L 1085 290" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60" y="420" width="360" height="70" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="240.0" y="444.0" class="bt" fill="#eef4f2">Compare-and-swap write</text>
<text x="240.0" y="462.0" class="bs">replaceJson(ifMatch: ETag) on ONE object</text>
<text x="240.0" y="480.0" class="bm">publications/&lt;id&gt;.json</text>
<rect x="460" y="420" width="360" height="70" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="640.0" y="451.0" class="bt" fill="#eef4f2">History event</text>
<text x="640.0" y="469.0" class="bs">published · scheduled · withdrawn · deleted</text>
<rect x="860" y="420" width="360" height="70" rx="11" fill="#0f201a" stroke="#3fbf8c"/>
<text x="1040.0" y="444.0" class="bt" fill="#eafff5">Client site reads</text>
<text x="1040.0" y="462.0" class="bs">/api/site-page · site-pages · site-content</text>
<text x="1040.0" y="480.0" class="bm">published content only</text>
<path d="M 185 354 L 240 420" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 420 455 L 460 455" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 820 455 L 860 455" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60" y="530" width="360" height="64" rx="11" fill="#231213" stroke="#b8504c"/>
<text x="240.0" y="558.0" class="bt" fill="#ffecea">Withdraw / delete</text>
<text x="240.0" y="576.0" class="bs">selected targets or all</text>
<rect x="460" y="530" width="360" height="64" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="640.0" y="551.0" class="bt" fill="#eef4f2">revalidateSites()</text>
<text x="640.0" y="569.0" class="bs">POST /api/roistation/revalidate</text>
<text x="640.0" y="587.0" class="bm">x-roistation-secret</text>
<rect x="860" y="530" width="360" height="64" rx="11" fill="#111a18" stroke="#26332f"/>
<text x="1040.0" y="558.0" class="bt" fill="#eef4f2">Site cache purged</text>
<text x="1040.0" y="576.0" class="bs">else ISR window: 30 s pages · 15 s slots</text>
<path d="M 420 562 L 460 562" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 820 562 L 860 562" fill="none" stroke="#5f7c75" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
